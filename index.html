<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>KHdesign</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo">
    <img src="logo1.png" alt="logo">
  </div>

  <ul class="menu">
    <li><a href="#">หน้าแรก</a></li>
    <li><a href="#">เสื้อพิมพ์ลาย</a></li>
    <li><a href="#">เสื้อcotton</a></li>
    <li><a href="#">สติกเกอร์</a></li>
    <li><a href="#">ติดต่อเรา</a></li>
  </ul>

  <div class="search">
    <input type="text" placeholder="ค้นหา">
  </div>
</div>

<!-- HERO SECTION -->
<section class="hero">
  <img src="bg1.png" class="bg">

  <div class="hero-text">
    <h1>KHdesign</h1>
    <h2>Collection</h2>
    <p>JERSEY • COTTON • STICKER • MORE</p>
  </div>

  <div class="scroll">
    <span></span>
    <p>SCROLL</p>
  </div>
</section>

<!-- SECTION 2 -->
<section class="section">
  <img src="bg2.png">
</section>

<!-- SECTION 3 -->
<section class="section">
  <img src="bg3.png">
</section>

<!-- SECTION 4 -->
<section class="section">
  <img src="bg4.png">
</section>

<script>
const sections = document.querySelectorAll("section");

window.addEventListener("scroll", () => {
  const trigger = window.innerHeight * 0.8;

  sections.forEach(section => {
    const top = section.getBoundingClientRect().top;

    if (top < trigger) {
      section.classList.add("show");
    }
  });
});
</script>

</body>
</html>
