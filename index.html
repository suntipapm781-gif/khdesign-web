<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>KHdesign</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">

  <!-- ICON -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>

<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="nav-left">
      <img src="images/logo.png" class="logo">
    </div>

    <div class="nav-center">
      <a href="#">หน้าแรก</a>
      <a href="#">บริการ</a>
      <a href="#">ผลงาน</a>
      <a href="#">ติดต่อเรา</a>
    </div>

    <div class="nav-right">
      <input type="text" placeholder="ค้นหา" class="search">
    </div>
  </header>

  <!-- HERO (4 รูป) -->
  <section class="hero"><img src="bg1.png"></section>
  <section class="hero"><img src="bg2.png"></section>
  <section class="hero"><img src="bg3.png"></section>
  <section class="hero"><img src="bg4.png"></section>

  <!-- TEXT SLIDE -->
  <section class="text-slide">
    <div class="slide">
      <h1>KHDESIGN</h1>
      <p>DESIGN PRODUCE COTTON DTF STICKER</p>
    </div>

    <div class="slide">
      <h1>คุณพกไอเดียมา เราออกแบบให้</h1>
      <div class="social">
        <i class="fab fa-facebook"></i>
        <i class="fab fa-line"></i>
        <i class="fab fa-instagram"></i>
        <i class="fab fa-tiktok"></i>
      </div>
    </div>
  </section>

  <!-- SCROLL EFFECT -->
  <script>
    const sections = document.querySelectorAll('.hero');

    window.addEventListener('scroll', () => {
      sections.forEach(section => {
        const rect = section.getBoundingClientRect();
        if (rect.top < window.innerHeight * 0.8) {
          section.classList.add('active');
        }
      });
    });
  </script>

</body>
</html>
