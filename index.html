<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>KHdesign</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">

<div class="logo">
<img src="./assets/logo1.png">
</div>

<ul class="menu">
<li><a href="#">หน้าแรก</a></li>
<li><a href="#">เสื้อพิมพ์ลาย</a></li>
<li><a href="#">เสื้อcotton</a></li>
<li><a href="#">สติกเกอร์</a></li>
<li><a href="#">งานวาด</a></li>
<li><a href="#">ติดต่อเรา</a></li>
</ul>

<div class="search">
<input type="text" placeholder="ค้นหา">
</div>

<div class="hamburger" onclick="toggleMenu()">
<span></span>
<span></span>
<span></span>
</div>

</div>

<div class="overlay" onclick="closeMenu()"></div>
<div class="close-btn" onclick="closeMenu()">✕</div>

<!-- HERO -->
<section class="hero">
<img src="./assets/bg5.png">
<div class="scroll">
<span></span>
<p>เลื่อนลง</p>
</div>
</section>

<!-- SECTION -->
<section class="section">
<img src="./assets/bg11.png">
</section>

<section class="section">
<img src=".assets/bg22.png">
</section>

<section class="section">
<img src="./assets/bg33.png">
</section>

<section class="section">
<img src="./assets/bg44.png">
</section>

<!-- SLIDER -->
<section class="slider">

<button class="prev" onclick="prevSlide()">❮</button>

<div class="slides">

<div class="slide">
<img src="./assets/bg11.png">
</div>

<div class="slide">
<img src="./assets/bg22.png">
</div>

<div class="slide">
<img src="./assets/bg33.png">
</div>

<div class="slide">
<img src="./assets/bg44.png">
</div>

</div>

<button class="next" onclick="nextSlide()">❯</button>

</section>

<script>

function toggleMenu(){
document.querySelector('.menu').classList.toggle('active')
document.querySelector('.overlay').classList.toggle('active')
document.querySelector('.close-btn').classList.toggle('active')
}

function closeMenu(){
document.querySelector('.menu').classList.remove('active')
document.querySelector('.overlay').classList.remove('active')
document.querySelector('.close-btn').classList.remove('active')
}

let index = 0
const slides = document.querySelector('.slides')
const total = document.querySelectorAll('.slide').length

function showSlide(){
slides.style.transform = "translateX(" + (-index*100) + "%)"
}

function nextSlide(){
index++
if(index >= total){index = 0}
showSlide()
}

function prevSlide(){
index--
if(index < 0){index = total-1}
showSlide()
}

setInterval(nextSlide,4000)

</script>

</body>
</html>
