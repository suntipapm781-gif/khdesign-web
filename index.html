<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>KHdesign</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- NAVBAR -->
  <div class="navbar">

    <div class="logo">
      <img src="logo1.png" alt="">
    </div>

    <ul class="menu">
      <li><a href="#">หน้าแรก</a></li>
      <li><a href="#">เสื้อพิมพ์ลาย</a></li>
      <li><a href="#">เสื้อcotton</a></li>
      <li><a href="#">สติกเกอร์</a></li>
      <li><a href="#">งานวาด</a></li>
      <li><a href="#">ติดต่อเรา</a></li>
    </ul>

    <div class="search">
      <input type="text" placeholder="ค้นหา">
    </div>

    <!-- hamburger -->
    <div class="hamburger" onclick="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>

  </div>

  <!-- overlay -->
  <div class="overlay" onclick="toggleMenu()"></div>

  <!-- HERO -->
  <section class="hero">
    <img src="bg5.png" alt="">

    <div class="scroll">
      <span></span>
      <p>เลื่อนลง</p>
    </div>
  </section>

  <!-- SECTION -->
  <section class="section">
    <img src="bg1.png" alt="">
  </section>

  <section class="section">
    <img src="bg2.png" alt="">
  </section>

  <section class="section">
    <img src="bg3.png" alt="">
  </section>

  <section class="section">
    <img src="bg4.png" alt="">
  </section>

  <!-- SCRIPT -->
  <script>
    function toggleMenu() {
      document.querySelector('.menu').classList.toggle('active');
      document.querySelector('.overlay').classList.toggle('active');
    }
  </script>

</body>
</html>
